name: Skill release

# Distributes approved skills. Flow:
#   1. check    - release readiness: approved evaluation of this exact content, gate passed, verdict allowed,
#                 version bumped with a changelog entry, package safety (size, file types, secrets, scripts)
#   2. publish  - waits for the HUMAN RELEASE GATE (environment "skill-release-approval"), then:
#                 records the release, refreshes the Claude Code marketplace and CATALOG.md (results PR),
#                 creates a GitHub Release <skill>-v<version> with the zip, uploads to the Claude API (if on),
#                 opens an "upload to Claude.ai" issue for an Owner, and emails the announcement list.
#
# Starts automatically when a distribution/<skill>.yaml version bump lands on main, or from
# Actions -> Skill release -> Run workflow (also: deprecate, retire, reactivate, confirm Claude.ai upload).

run-name: >-
  ${{ github.event_name == 'push' && 'Skill release: new versions on main'
  || format('Skill {0}: {1}', inputs.action, inputs.skill) }}

on:
  push:
    branches: [main]
    paths: ["distribution/*.yaml"]
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill (the list is generated from skills/ - python -m skilleval sync-workflow)"
        type: choice
        options:
          - pending (every skill with a new version)
          # BEGIN skill-options (generated by `python -m skilleval sync-workflow` - do not edit by hand)
          - conventional-commits
          - csv-data-profiler
          - incident-postmortem
          - meeting-minutes
          - pii-redactor
          - snowflake-sql-review
          # END skill-options
        default: pending (every skill with a new version)
      action:
        description: "release = publish the version in distribution/<skill>.yaml; deprecate / retire / reactivate change its status; confirm-claude-ai records that an Owner uploaded it to Claude.ai"
        type: choice
        options: [release, deprecate, retire, reactivate, confirm-claude-ai]
        default: release
      reason:
        description: "Reason (deprecate / retire) - shown in the catalog and the announcement"
        required: false
        default: ""
      replaced_by:
        description: "Deprecate only: the skill users should switch to"
        required: false
        default: ""
      upload_api:
        description: "Also upload to the Claude API Skills endpoint (skills whose channels include api; needs SKILLS_API_KEY)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: skill-release
  cancel-in-progress: false

env:
  SKILL_INPUT: ${{ inputs.skill }}
  ACTION: ${{ inputs.action || 'release' }}
  REASON: ${{ inputs.reason }}
  REPLACED_BY: ${{ inputs.replaced_by }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      skills: ${{ steps.select.outputs.skills }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: Select skills
        id: select
        run: |
          if [ "$ACTION" = "release" ] && { [ -z "$SKILL_INPUT" ] || [[ "$SKILL_INPUT" == pending* ]]; }; then
            SKILLS=$(python -m skilldist pending)
          elif [[ "$SKILL_INPUT" == pending* ]]; then
            echo "::error::Choose a specific skill for '$ACTION'."; exit 1
          else
            SKILLS="$SKILL_INPUT"
          fi
          echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
          if [ -z "$SKILLS" ]; then
            echo "No skill has a version newer than its last release - nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skills: $SKILLS"
          fi

      - name: Release readiness check
        if: steps.select.outputs.skills != ''
        run: |
          ARGS=""
          IFS=',' read -ra LIST <<< "${{ steps.select.outputs.skills }}"
          for s in "${LIST[@]}"; do ARGS="$ARGS --skill $s"; done
          CHECK_ACTION=release; [ "$ACTION" != "release" ] && CHECK_ACTION=status
          set +e
          python -m skilldist check $ARGS --action "$CHECK_ACTION" --summary check.md
          RC=$?
          set -e
          { echo "## Skill $ACTION - readiness"; echo; cat check.md; } >> "$GITHUB_STEP_SUMMARY"
          if [ $RC -ne 0 ]; then
            echo "::error::Release check failed - see the summary for what to fix."
            exit 1
          fi

      - name: Build packages
        if: steps.select.outputs.skills != '' && env.ACTION == 'release'
        run: |
          IFS=',' read -ra LIST <<< "${{ steps.select.outputs.skills }}"
          for s in "${LIST[@]}"; do python -m skilldist package --skill "$s" --out dist; done
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.skills != '' && env.ACTION == 'release'
        with:
          name: skill-packages-${{ github.run_id }}
          path: |
            dist/
            check.md
          retention-days: 90

  publish:
    needs: check
    if: needs.check.outputs.skills != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The HUMAN RELEASE GATE: Settings -> Environments -> skill-release-approval -> Required reviewers
    # (e.g. the AI governance group - ideally different people from the evaluation reviewers).
    environment: skill-release-approval
    env:
      GH_TOKEN: ${{ github.token }}
      SKILLS: ${{ needs.check.outputs.skills }}
      SKILLS_API_KEY: ${{ secrets.SKILLS_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SKILL_EVAL_BOT_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: Who approved
        id: who
        run: |
          APPROVER=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals" \
                       --jq '[.[] | select(.state=="approved")][-1].user.login' 2>/dev/null || true)
          NOTE=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals" \
                       --jq '[.[] | select(.state=="approved")][-1].comment' 2>/dev/null || true)
          if [ -z "$APPROVER" ] || [ "$APPROVER" = "null" ]; then
            echo "::error::No release approval was recorded - add Required reviewers to the skill-release-approval environment (Settings -> Environments). Nothing was released."
            exit 1
          fi
          echo "approver=$APPROVER" >> "$GITHUB_OUTPUT"
          { echo "note<<EOF"; echo "$NOTE"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Release / change status
        id: apply
        env:
          APPROVER: ${{ steps.who.outputs.approver }}
          NOTE: ${{ steps.who.outputs.note }}
        run: |
          git config user.name "skill-release-bot"; git config user.email "skill-release-bot@users.noreply.github.com"
          IFS=',' read -ra LIST <<< "$SKILLS"
          for s in "${LIST[@]}"; do
            case "$ACTION" in
              release)
                API=""; [ "${{ inputs.upload_api }}" = "true" ] && API="--api"
                python -m skilldist release --skill "$s" --approver "$APPROVER" --note "$NOTE" --run-url "$RUN_URL" --out dist $API ;;
              deprecate) python -m skilldist deprecate --skill "$s" --approver "$APPROVER" --reason "$REASON" --replaced-by "$REPLACED_BY" ;;
              retire)    python -m skilldist retire --skill "$s" --approver "$APPROVER" --reason "$REASON" ;;
              reactivate) python -m skilldist reactivate --skill "$s" --approver "$APPROVER" --reason "$REASON" ;;
              confirm-claude-ai) python -m skilldist confirm-claude-ai --skill "$s" --by "$APPROVER" ;;
            esac
          done
          git add -A distribution releases marketplace .claude-plugin CATALOG.md registry
          git commit -m "release: $ACTION $SKILLS" -m "Approved-by: $APPROVER" -m "Run: $RUN_URL"
          BRANCH="skill-release/${{ github.run_id }}"
          git push origin HEAD:"$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          gh pr create --base main --head "$BRANCH" \
            --title "Skill $ACTION: $SKILLS (approved by $APPROVER)" \
            --body "$(printf 'Approved by **%s** in %s.\n\nMerging this PR publishes the change to the Claude Code marketplace and CATALOG.md.\n\n%s' "$APPROVER" "$RUN_URL" "$(python -m skilldist check $(for s in "${LIST[@]}"; do printf -- '--skill %s ' "$s"; done) --action status 2>/dev/null | head -60)")" \
            > pr_url.txt
          echo "pr=$(cat pr_url.txt)" >> "$GITHUB_OUTPUT"

      - name: GitHub Release with the package
        if: env.ACTION == 'release'
        run: |
          IFS=',' read -ra LIST <<< "$SKILLS"
          for s in "${LIST[@]}"; do
            python - "$s" > notes.md <<'PY'
          import json, sys
          from skilldist import core
          r = core.latest_release(sys.argv[1])
          print(f"**{r['skill']} {r['version']}** - {r['changelog']}\n")
          print(f"- Approved by {r['approved_by']} ({r['run_url']})")
          print(f"- Evaluation: verdict {r['evaluation_verdict']}, pass rate {(r['evaluation_pass_rate'] or 0):.0%} - {r['evaluation_path']}")
          print(f"- Channels: {', '.join(r['channels_done'])}")
          print(f"- Package: `{r['package']}` sha256 `{r['sha256']}`")
          if r["warnings"]:
              print("\nReviewer warnings:\n" + "\n".join(f"- {w}" for w in r["warnings"]))
          print("\n**Claude.ai:** an Owner uploads this zip in Organization settings > Plugins & skills > Add > Upload a skill.")
          PY
            V=$(python -c "from skilldist import core; print(core.latest_release('$s')['version'])")
            gh release create "$s-v$V" "dist/$s-$V.zip" --target "${{ steps.apply.outputs.sha }}" \
              --title "$s $V" --notes-file notes.md
          done

      - name: Ask a Claude.ai Owner to upload / remove
        run: |
          ASSIGNEES=$(python -c "from skilldist import core; print(','.join(core.dist_config()['notify'].get('claude_ai_admins', [])))")
          IFS=',' read -ra LIST <<< "$SKILLS"
          for s in "${LIST[@]}"; do
            IN=$(python -c "from skilldist import core; m=core.manifest('$s'); print('yes' if 'claude_ai' in m['channels'] and core.dist_config()['channels'].get('claude_ai') else 'no')")
            [ "$IN" != "yes" ] && continue
            V=$(python -c "from skilldist import core; r=core.latest_release('$s'); print(r['version'] if r else '')")
            AUD=$(python -c "from skilldist import core; print(core.manifest('$s')['audience'])")
            case "$ACTION" in
              release)
                TITLE="Upload to Claude.ai: $s $V"
                BODY="Approved release - please provision it for the organization.

          1. Download \`$s-$V.zip\` from the release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$s-v$V
          2. claude.ai > Organization settings > Plugins & skills > **Add** > **Upload a skill** (Team/Enterprise Owner).
             If an older version of \`$s\` is already provisioned, replace it with this one.
          3. Audience: **$AUD** (\`all\` = whole organization; group names = Enterprise group targeting via a plugin).
          4. Then run Actions > Skill release > skill \`$s\` > action **confirm-claude-ai** to record it, and close this issue." ;;
              deprecate)
                TITLE="Claude.ai: mark $s as deprecated"
                BODY="\`$s\` was deprecated ($REASON).${REPLACED_BY:+ Replacement: \`$REPLACED_BY\`.} Update its description in Organization settings > Plugins & skills, or remove it once users have moved." ;;
              retire)
                TITLE="Remove from Claude.ai: $s"
                BODY="\`$s\` was retired ($REASON). Remove it in Organization settings > Plugins & skills, then close this issue." ;;
              *) continue ;;
            esac
            gh issue create --title "$TITLE" --body "$BODY" ${ASSIGNEES:+--assignee "$ASSIGNEES"} \
              || gh issue create --title "$TITLE" --body "$BODY"
          done

      - name: Announce
        env:
          APPROVER: ${{ steps.who.outputs.approver }}
          PR_URL: ${{ steps.apply.outputs.pr }}
        run: |
          python - <<'PY'
          import os
          from html import escape
          from skilldist import core
          from skilleval.notify import send
          to = core.dist_config()["notify"].get("announce_emails") or []
          action, skills = os.environ["ACTION"], os.environ["SKILLS"].split(",")
          rows = []
          for s in skills:
              r, m = core.latest_release(s), core.manifest(s)
              _, desc = core.skill_identity(core.skills_dir() / s)
              rows.append(f"<li><b>{escape(s)}</b> {escape((r or {}).get('version', ''))} - {escape(desc[:200])}"
                          + (f"<br><i>{escape((r or {}).get('changelog', ''))}</i>" if action == 'release' else "")
                          + (f"<br>Reason: {escape(os.environ.get('REASON', ''))}" if action in ('deprecate', 'retire') else "")
                          + "</li>")
          subject = f"[Skills] {action}: {', '.join(skills)}"
          html = (f"<p>{escape(action.capitalize())} approved by {escape(os.environ['APPROVER'])}.</p><ul>{''.join(rows)}</ul>"
                  f"<p>Catalog and install instructions: CATALOG.md in the skills repo. Change: {escape(os.environ.get('PR_URL', ''))}</p>")
          try:
              send(to, subject, html, subject)
          except Exception as e:
              print(f"::warning::announcement email not sent: {e}")
          PY
          echo "### $ACTION approved by **${{ steps.who.outputs.approver }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "Change PR: ${{ steps.apply.outputs.pr }} - merge it to update the marketplace and catalog." >> "$GITHUB_STEP_SUMMARY"
